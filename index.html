<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>極真滿水碗 - 動態波浪版</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0d0e12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #canvas {
      background: radial-gradient(circle, #1a1c23 0%, #08090c 100%);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .controls {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    button {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    button:active { transform: scale(0.95); }
    #startBtn { background: #007aff; }
    #info {
      position: absolute;
      top: 25px;
      text-align: center;
      font-size: 14px;
      color: #a0a0a5;
    }
    #waterLevel {
      color: #34c759;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="info">
    <div>傾斜角度: <span id="angleText">0°</span></div>
    <div>剩餘水量: <span id="waterLevel">100%</span></div>
  </div>

  <canvas id="canvas" width="340" height="480"></canvas>

  <div class="controls">
    <button id="startBtn">開啟陀螺儀</button>
    <button id="resetBtn">重新加滿水</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const angleText = document.getElementById('angleText');
    const waterLevelText = document.getElementById('waterLevel');

    let gamma = 0; 
    let previousGamma = 0;
    let smoothedGamma = 0;

    // 水面波浪物理參數
    let wavePhase = 0;        // 正弦波相位
    let waveAmplitude = 0;    // 波浪振幅 (高度)
    let waveVelocity = 0;     // 波浪注入能量/速度
    const damping = 0.94;     // 阻尼 (讓波浪隨時間消散)
    const tension = 0.08;     // 彈性 (拉回水平線)

    const bowl = {
      x: 170,
      y: 260,
      radiusX: 110,
      radiusY: 75,
      rimY: -30
    };

    let waterVolume = 1.0;
    let drops = [];

    // 陀螺儀授權
    startBtn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && 
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            startBtn.style.display = 'none';
          }
        } catch (e) { console.error(e); }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        startBtn.style.display = 'none';
      }
    });

    resetBtn.addEventListener('click', () => {
      waterVolume = 1.0;
      drops = [];
      waveAmplitude = 0;
      waveVelocity = 0;
    });

    function handleOrientation(e) {
      if (e.gamma !== null) {
        gamma = e.gamma;
        
        // 計算晃動角速度，將晃動力道轉化為波浪能量
        const deltaGamma = gamma - previousGamma;
        waveVelocity += deltaGamma * 0.45;
        previousGamma = gamma;
      }
    }

    function updateWavePhysics() {
      // 簡諧運動與阻尼計算
      const force = -tension * waveAmplitude;
      waveVelocity += force;
      waveVelocity *= damping;
      waveAmplitude += waveVelocity;

      // 限制波浪最大震幅
      waveAmplitude = Math.max(-18, Math.min(18, waveAmplitude));

      // 波浪推進
      wavePhase += 0.18;
    }

    function animate() {
      updateWavePhysics();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      smoothedGamma += (gamma - smoothedGamma) * 0.15;
      const rad = (smoothedGamma * Math.PI) / 180;

      angleText.innerText = `${Math.round(smoothedGamma)}°`;

      // -------------------------------------------------------------
      // 1. 物理容積計算 (考慮角度與強烈波浪帶來的額外溢出)
      // -------------------------------------------------------------
      const waveSpillImpact = Math.abs(waveAmplitude) * 0.008;
      const maxAllowedVolume = Math.max(0, 1.0 - Math.sin(Math.abs(rad)) * 1.5 - waveSpillImpact);

      if (maxAllowedVolume < waterVolume) {
        const overflow = waterVolume - maxAllowedVolume;
        waterVolume = maxAllowedVolume;

        if (overflow > 0.002) {
          const spillSide = (smoothedGamma + waveVelocity) > 0 ? 1 : -1;
          const lipX = bowl.x + spillSide * bowl.radiusX * Math.cos(rad);
          const lipY = bowl.y + bowl.rimY * Math.cos(rad) + spillSide * bowl.radiusX * Math.sin(rad);

          for (let i = 0; i < 2; i++) {
            drops.push({
              x: lipX + (Math.random() - 0.5) * 6,
              y: lipY,
              vx: spillSide * (1.5 + Math.random() * 2),
              vy: -0.5 + Math.random() * 1.5,
              radius: 3 + Math.random() * 3
            });
          }
        }
      }

      waterLevelText.innerText = `${Math.round(waterVolume * 100)}%`;

      // -------------------------------------------------------------
      // 2. 繪製碗背壁
      // -------------------------------------------------------------
      ctx.save();
      ctx.translate(bowl.x, bowl.y);
      ctx.rotate(rad);

      ctx.beginPath();
      ctx.ellipse(0, 0, bowl.radiusX, bowl.radiusY, 0, 0, Math.PI);
      ctx.fillStyle = '#141519';
      ctx.fill();

      ctx.restore();

      // -------------------------------------------------------------
      // 3. 繪製碗內波浪水體（精確裁切在碗內）
      // -------------------------------------------------------------
      if (waterVolume > 0.005) {
        ctx.save();

        // 裁切區域：打斜後的碗內壁
        ctx.translate(bowl.x, bowl.y);
        ctx.rotate(rad);

        ctx.beginPath();
        ctx.ellipse(0, 0, bowl.radiusX - 2, bowl.radiusY - 2, 0, 0, Math.PI);
        ctx.clip();

        // 切回世界座標系繪製動態波浪水面
        ctx.rotate(-rad);
        ctx.translate(-bowl.x, -bowl.y);

        const currentWaterDepth = (1 - waterVolume) * (bowl.radiusY - bowl.rimY);
        const lowestLipOffsetY = Math.sin(Math.abs(rad)) * bowl.radiusX;
        const baseWaterY = bowl.y + bowl.rimY + currentWaterDepth + (smoothedGamma !== 0 ? lowestLipOffsetY * 0.5 : 0);

        // 多點繪製帶波浪的正弦水面
        const segments = 30;
        const startX = 0;
        const endX = canvas.width;
        const step = (endX - startX) / segments;

        ctx.beginPath();
        ctx.moveTo(startX, canvas.height);

        for (let i = 0; i <= segments; i++) {
          const x = startX + i * step;
          const progress = i / segments;
          
          // 正弦波波浪高低 offset
          const waveY = Math.sin(progress * Math.PI * 2.5 + wavePhase) * waveAmplitude;
          const y = baseWaterY + waveY;

          if (i === 0) {
            ctx.lineTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        ctx.lineTo(endX, canvas.height);
        ctx.closePath();

        // 漸層水體顏色
        const waterGrad = ctx.createLinearGradient(0, bowl.y - bowl.radiusY, 0, bowl.y + bowl.radiusY);
        waterGrad.addColorStop(0, 'rgba(0, 165, 255, 0.85)');
        waterGrad.addColorStop(1, 'rgba(0, 75, 190, 0.95)');
        ctx.fillStyle = waterGrad;
        ctx.fill();

        // 波浪頂部的高光白色水線
        ctx.beginPath();
        for (let i = 0; i <= segments; i++) {
          const x = startX + i * step;
          const progress = i / segments;
          const waveY = Math.sin(progress * Math.PI * 2.5 + wavePhase) * waveAmplitude;
          const y = baseWaterY + waveY;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.restore();
      }

      // -------------------------------------------------------------
      // 4. 繪製碗前壁 (陶瓷材質)
      // -------------------------------------------------------------
      ctx.save();
      ctx.translate(bowl.x, bowl.y);
      ctx.rotate(rad);

      ctx.beginPath();
      ctx.ellipse(0, 0, bowl.radiusX, bowl.radiusY, 0, 0, Math.PI);
      
      const bowlGrad = ctx.createLinearGradient(-bowl.radiusX, 0, bowl.radiusX, bowl.radiusY);
      bowlGrad.addColorStop(0, '#383b42');
      bowlGrad.addColorStop(0.5, '#212328');
      bowlGrad.addColorStop(1, '#111215');
      ctx.fillStyle = bowlGrad;
      ctx.fill();
      
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#4f525b';
      ctx.stroke();

      // 碗口邊圈
      ctx.beginPath();
      ctx.ellipse(0, bowl.rimY, bowl.radiusX, 10, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();

      // -------------------------------------------------------------
      // 5. 水滴粒子
      // -------------------------------------------------------------
      for (let i = drops.length - 1; i >= 0; i--) {
        let d = drops[i];
        d.vy += 0.35;
        d.x += d.vx;
        d.y += d.vy;

        ctx.beginPath();
        ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 160, 255, 0.85)';
        ctx.fill();

        if (d.y > canvas.height) {
          drops.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
