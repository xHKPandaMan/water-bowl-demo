<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>極真滿水碗物理模擬</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0d0e12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #canvas {
      background: radial-gradient(circle, #1a1c23 0%, #08090c 100%);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .controls {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    button {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    button:active { transform: scale(0.95); }
    #startBtn { background: #007aff; }
    #info {
      position: absolute;
      top: 25px;
      text-align: center;
      font-size: 14px;
      color: #a0a0a5;
    }
    #waterLevel {
      color: #34c759;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="info">
    <div>傾斜角度: <span id="angleText">0°</span></div>
    <div>剩餘水量: <span id="waterLevel">100%</span></div>
  </div>

  <canvas id="canvas" width="340" height="480"></canvas>

  <div class="controls">
    <button id="startBtn">開啟陀螺儀</button>
    <button id="resetBtn">重新加滿水</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const angleText = document.getElementById('angleText');
    const waterLevelText = document.getElementById('waterLevel');

    let gamma = 0; // 手機左右傾斜角
    let smoothedGamma = 0;

    // 碗的幾何參數 (以 Canvas 中心為基準)
    const bowl = {
      x: 170,
      y: 260,
      radiusX: 120, // 碗口半寬
      radiusY: 80,  // 碗半高
      rimY: -35     // 碗口頂端相對 Y 軸
    };

    // 容積狀態
    let maxWaterLevel = 1.0; // 當前最大水量比例 (1.0 = 滿水)
    let drops = []; // 溢出的水滴粒子

    // 陀螺儀授權
    startBtn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && 
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', e => { if (e.gamma !== null) gamma = e.gamma; });
            startBtn.style.display = 'none';
          }
        } catch (e) { console.error(e); }
      } else {
        window.addEventListener('deviceorientation', e => { if (e.gamma !== null) gamma = e.gamma; });
        startBtn.style.display = 'none';
      }
    });

    // 重新加滿水
    resetBtn.addEventListener('click', () => {
      maxWaterLevel = 1.0;
      drops = [];
    });

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 平滑化角度（防震手）
      smoothedGamma += (gamma - smoothedGamma) * 0.15;
      const rad = (smoothedGamma * Math.PI) / 180; // 傾斜弧度

      angleText.innerText = `${Math.round(smoothedGamma)}°`;

      // -------------------------------------------------------------
      // 1. 幾何物理計算：當前傾斜角度下的「最大可裝水量」
      // -------------------------------------------------------------
      // 當碗傾斜 angle 時， lowest rim (最低碗口邊緣) 會下降。
      // 溢出極限由傾斜角決定：角度越大，容量越小
      const absAngle = Math.abs(smoothedGamma);
      
      // 計算傾斜後的容積上限 (幾何公式簡化)
      // 傾斜 0 度容量 1.0，傾斜超過 45 度水幾乎全部瀉光
      let capacityLimit = Math.max(0, 1.0 - Math.sin(Math.abs(rad)) * 1.6);

      // 如果當前容量上限低於當前水量，發生「倒瀉水」！
      if (capacityLimit < maxWaterLevel) {
        const spillAmount = maxWaterLevel - capacityLimit;
        maxWaterLevel = capacityLimit; // 水量永久減少！

        // 產生倒瀉出去的水滴粒子
        if (spillAmount > 0.001) {
          const spillSide = smoothedGamma > 0 ? 1 : -1; // 往左還是往右瀉
          const lipX = bowl.x + spillSide * bowl.radiusX * Math.cos(rad);
          const lipY = bowl.y + bowl.rimY + spillSide * bowl.radiusX * Math.sin(rad);

          for (let i = 0; i < 3; i++) {
            drops.push({
              x: lipX + (Math.random() - 0.5) * 10,
              y: lipY,
              vx: spillSide * (2 + Math.random() * 3),
              vy: -1 + Math.random() * 2,
              radius: 3 + Math.random() * 4
            });
          }
        }
      }

      waterLevelText.innerText = `${Math.round(maxWaterLevel * 100)}%`;

      // -------------------------------------------------------------
      // 2. 繪製隨手機 1:1 傾斜的碗底與內壁
      // -------------------------------------------------------------
      ctx.save();
      ctx.translate(bowl.x, bowl.y);
      ctx.rotate(rad); // 碗完全隨手機角度旋轉！

      // 碗內壁 (暗色背板)
      ctx.beginPath();
      ctx.ellipse(0, 0, bowl.radiusX, bowl.radiusY, 0, 0, Math.PI);
      ctx.fillStyle = '#18191e';
      ctx.fill();

      ctx.restore();

      // -------------------------------------------------------------
      // 3. 繪製水平的水面（物理裁剪）
      // -------------------------------------------------------------
      ctx.save();
      
      // 先將繪製區域裁剪為「旋轉後的碗的內部」
      ctx.save();
      ctx.translate(bowl.x, bowl.y);
      ctx.rotate(rad);
      ctx.beginPath();
      ctx.ellipse(0, 0, bowl.radiusX - 3, bowl.radiusY - 3, 0, 0, Math.PI);
      ctx.clip();
      ctx.restore();

      // 在碗內部繪製「永遠保持水平」的水
      if (maxWaterLevel > 0.01) {
        ctx.beginPath();

        // 根據剩餘水量比例計算水面高度 (未傾斜時的 Y 軸)
        const waterHeight = bowl.rimY + (1 - maxWaterLevel) * (bowl.radiusY - bowl.rimY);

        // 由於 Context 已被 Clip 在碗內，這裡直接畫一個水平矩形填滿水
        // 矩形覆蓋整個碗底部
        ctx.rect(0, bowl.y + waterHeight, canvas.width, canvas.height);

        // 水體藍色漸層
        const grad = ctx.createLinearGradient(0, bowl.y + bowl.rimY, 0, bowl.y + bowl.radiusY);
        grad.addColorStop(0, 'rgba(52, 199, 89, 0.9)');  // 頂層清澈綠藍色
        grad.addColorStop(1, 'rgba(0, 122, 255, 0.95)'); // 底層深藍色
        ctx.fillStyle = grad;
        ctx.fill();

        // 繪製頂層水平水面的高光白線
        ctx.beginPath();
        ctx.moveTo(0, bowl.y + waterHeight);
        ctx.lineTo(canvas.width, bowl.y + waterHeight);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.restore();

      // -------------------------------------------------------------
      // 4. 繪製碗的前壁 (遮擋水) 與碗邊框
      // -------------------------------------------------------------
      ctx.save();
      ctx.translate(bowl.x, bowl.y);
      ctx.rotate(rad);

      // 碗的外壁
      ctx.beginPath();
      ctx.ellipse(0, 0, bowl.radiusX, bowl.radiusY, 0, 0, Math.PI);
      const bowlGrad = ctx.createLinearGradient(-bowl.radiusX, 0, bowl.radiusX, bowl.radiusY);
      bowlGrad.addColorStop(0, '#3a3d45');
      bowlGrad.addColorStop(0.5, '#23252b');
      bowlGrad.addColorStop(1, '#111215');
      ctx.fillStyle = bowlGrad;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#555861';
      ctx.stroke();

      // 碗口高光圓圈
      ctx.beginPath();
      ctx.ellipse(0, bowl.rimY, bowl.radiusX, 12, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();

      // -------------------------------------------------------------
      // 5. 繪製並更新飛濺出去的水滴粒子
      // -------------------------------------------------------------
      for (let i = drops.length - 1; i >= 0; i--) {
        let d = drops[i];
        d.vy += 0.4; // 常規重力加速度
        d.x += d.vx;
        d.y += d.vy;

        ctx.beginPath();
        ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(52, 199, 89, 0.8)';
        ctx.fill();

        // 掉出螢幕外自動清除
        if (d.y > canvas.height) {
          drops.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
