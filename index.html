<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>逼真 3D 擬真碗倒水</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0f1015;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #canvas {
      background: radial-gradient(circle, #1f232a 0%, #0a0b0e 100%);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }
    .controls {
      position: absolute;
      bottom: 25px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    button {
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    button:active { transform: scale(0.95); }
    #startBtn { background: #007aff; }
    #info {
      position: absolute;
      top: 20px;
      font-size: 13px;
      color: #8e8e93;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="info">傾斜手機感受水流 (Gamma: 0°)</div>
  <canvas id="canvas" width="340" height="480"></canvas>

  <div class="controls">
    <button id="startBtn">開啟陀螺儀</button>
    <button id="resetBtn">裝滿水</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const info = document.getElementById('info');

    // 全局狀態
    let gamma = 0; // 左右傾斜
    let beta = 0;  // 前後傾斜
    let smoothedGamma = 0;
    let particles = [];
    const NUM_PARTICLES = 120; // 水粒子數量

    // 碗的幾何參數
    const bowl = {
      x: 170,
      y: 260,
      width: 140,
      height: 90,
      rimY: -45 // 碗口相對 Y 軸
    };

    // 啟動陀螺儀權限
    startBtn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && 
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleMotion);
            startBtn.style.display = 'none';
          }
        } catch (e) { console.error(e); }
      } else {
        window.addEventListener('deviceorientation', handleMotion);
        startBtn.style.display = 'none';
      }
    });

    resetBtn.addEventListener('click', initWater);

    function handleMotion(e) {
      if (e.gamma !== null) gamma = e.gamma;
      if (e.beta !== null) beta = e.beta;
    }

    // 初始化水粒子
    function initWater() {
      particles = [];
      for (let i = 0; i < NUM_PARTICLES; i++) {
        particles.push({
          x: bowl.x + (Math.random() - 0.5) * (bowl.width * 0.8),
          y: bowl.y + Math.random() * (bowl.height * 0.5),
          vx: 0,
          vy: 0,
          radius: 7 + Math.random() * 4,
          isSpilled: false
        });
      }
    }

    // 物理與渲染主循環
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 平滑化陀螺儀數據（防震抖）
      smoothedGamma += (gamma - smoothedGamma) * 0.1;
      info.innerText = `傾斜角度 (Gamma: ${Math.round(smoothedGamma)}°)`;

      // 算重力方向
      const rad = (smoothedGamma * Math.PI) / 180;
      const gx = Math.sin(rad) * 0.6; // 橫向重力
      const gy = Math.cos(rad) * 0.6; // 縱向重力

      ctx.save();
      
      // --- 1. 繪製隨手機轉動的【3D 碗】 ---
      ctx.translate(bowl.x, bowl.y);
      ctx.rotate(rad * 0.3); // 碗隨傾斜微微旋轉，增加立體感

      // 碗陰影
      ctx.beginPath();
      ctx.ellipse(0, bowl.height / 2 + 15, bowl.width * 0.7, 15, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fill();

      // 碗背壁 (內側暗部)
      ctx.beginPath();
      ctx.ellipse(0, 0, bowl.width, bowl.height, 0, 0, Math.PI);
      ctx.fillStyle = '#1c1d22';
      ctx.fill();

      ctx.restore();

      // --- 2. 物理粒子模擬 (流體水滴) ---
      for (let p of particles) {
        if (!p.isSpilled) {
          // 受重力影響
          p.vx += gx;
          p.vy += gy;

          // 阻尼空氣阻力
          p.vx *= 0.96;
          p.vy *= 0.96;

          p.x += p.vx;
          p.y += p.vy;

          // 碗壁碰撞檢測（以橢圓公式計算）
          const dx = p.x - bowl.x;
          const dy = p.y - bowl.y;
          const dist = (dx * dx) / (bowl.width * bowl.width) + (dy * dy) / (bowl.height * bowl.height);

          // 粒子撞到碗底/碗壁反彈
          if (dist > 0.75 && dy > bowl.rimY) {
            const angle = Math.atan2(dy, dx);
            p.x = bowl.x + Math.cos(angle) * bowl.width * 0.85;
            p.y = bowl.y + Math.sin(angle) * bowl.height * 0.85;
            p.vx *= -0.3;
            p.vy *= -0.3;
          }

          // 判定是否從碗口瀉出（超出了碗口左右邊緣且高於碗口）
          if (dy < bowl.rimY || Math.abs(dx) > bowl.width * 0.9) {
            if (Math.abs(smoothedGamma) > 22) { // 傾斜角度大於 22 度溢出
              p.isSpilled = true;
            }
          }
        } else {
          // 倒瀉後自由落體
          p.vx += gx * 1.5;
          p.vy += 0.8; // 常規重力下落
          p.x += p.vx;
          p.y += p.vy;
        }
      }

      // --- 3. 繪製真實液體質感 (Metaball / 融球渲染) ---
      // 先繪製高對比度的水粒子
      ctx.save();
      for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        
        // 藍色流體高光漸層
        const grad = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, p.radius);
        grad.addColorStop(0, '#73d5ff');
        grad.addColorStop(0.6, '#0088ff');
        grad.addColorStop(1, 'rgba(0, 85, 255, 0.8)');
        
        ctx.fillStyle = grad;
        ctx.fill();
      }
      ctx.restore();

      // --- 4. 繪製碗前壁 (遮擋水滴，形成「水在碗裡面」的效果) ---
      ctx.save();
      ctx.translate(bowl.x, bowl.y);
      ctx.rotate(rad * 0.3);

      // 碗外壁陶瓷質感
      ctx.beginPath();
      ctx.ellipse(0, 0, bowl.width, bowl.height, 0, 0, Math.PI);
      const bowlGrad = ctx.createLinearGradient(-bowl.width, 0, bowl.width, bowl.height);
      bowlGrad.addColorStop(0, '#4a4d57');
      bowlGrad.addColorStop(0.5, '#2b2c33');
      bowlGrad.addColorStop(1, '#18191d');
      ctx.fillStyle = bowlGrad;
      ctx.fill();

      // 碗口高光外圈
      ctx.beginPath();
      ctx.ellipse(0, bowl.rimY, bowl.width, 18, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(animate);
    }

    // 初始化並啟動
    initWater();
    animate();
  </script>
</body>
</html>
